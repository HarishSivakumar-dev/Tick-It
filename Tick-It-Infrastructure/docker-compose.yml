services:
     kafka:
         image: apache/kafka:4.0.1
         ports: 
             - "19092:19092"
         networks:
             - kafka-network
         environment:
             KAFKA_NODE_ID: 1
             KAFKA_LISTENERS: EXTERNAL://:19092,CONTROLLER://:9093, INTERNAL://:9092
             KAFKA_PROCESS_ROLES: broker,controller
             KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 , 2@kafka2:9094
             KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
             KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT
             KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
             KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:19092, INTERNAL://kafka:9092
     kafka2:
        image: apache/kafka:4.0.1
        ports:
            - "19095:19095"
        networks:
            - kafka-network
        environment:
           KAFKA_NODE_ID: 2
           KAFKA_LISTENERS: EXTERNAL://:19095,CONTROLLER://:9094, INTERNAL://:9095
           KAFKA_PROCESS_ROLES: broker, controller
           KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093, 2@kafka2:9094
           KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
           KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT
           KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
           KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:19095, INTERNAL://kafka2:9095

networks:
    kafka-network:
       driver: bridge